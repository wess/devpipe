# Builds `devpipe` for the platforms the deploy script cannot.
#
# `site/deploy.sh` already produces the two that matter most and can be built
# from a Mac: Linux x86-64 in the same container the box binaries come from,
# and a universal macOS binary natively. That covers the machines a beta is
# actually run from, and it is why this is not on the critical path.
#
# What is here is the rest — Windows, and Linux on ARM — plus a checkable
# record that the CLI still compiles somewhere other than one laptop.
name: Devpipe CLI

on:
  push:
    tags: ["devpipe-cli-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing should still produce the others: a Windows
      # toolchain breaking is not a reason to have no Linux ARM build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: devpipe.exe
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: devpipe-linux-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: devpipe-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross-linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        working-directory: daemon
        run: cargo build --release --target ${{ matrix.target }} --bin devpipe

      - name: Name it for the platform
        shell: bash
        run: |
          src="daemon/target/${{ matrix.target }}/release/devpipe"
          [ -f "$src" ] || src="$src.exe"
          cp "$src" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
