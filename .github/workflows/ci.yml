name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build browser terminal
        working-directory: core
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Check TypeScript and formatting
        run: |
          bun run typecheck
          bun run check
      - name: Test application
        run: bun test --concurrency=1 tests/
      - name: Test terminal core
        working-directory: core
        run: cargo test --locked
      - name: Test box daemon
        working-directory: daemon
        run: cargo test --locked
      - name: Build local Docker backend
        run: docker build -f deploy/docker/box.Dockerfile -t devpipe-box:ci .
      - name: Exercise local Docker backend
        env:
          DEVPIPE_DOCKER_CONTRACT: "1"
          DEVPIPE_DOCKER_IMAGE: devpipe-box:ci
        run: bun test --concurrency=1 tests/docker.test.ts

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test iOS packages
        working-directory: ios
        run: swift test
