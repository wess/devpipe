[workspace]

[package]
name = "devpiped"
version = "0.1.0"
edition = "2024"
description = "Persistent terminal sessions over a websocket, for the Devpipe client"

[dependencies]
anyhow = "1"
# The `devpipe` bin's HTTP client. Blocking and small on purpose: it makes one
# request per invocation, and an async runtime plus a full client stack would
# be most of the binary. rustls rather than native-tls so the box needs no
# OpenSSL at runtime.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"
# The reverse proxy in `proxy.rs`. axum already carries hyper 1; these name it
# directly because the proxy is a *client* — the one thing the server half does
# not bring in — and TokioIo is what bridges its IO traits to tokio's.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# `ReaderStream`, so a file comes back as a stream rather than as a Vec. A box
# has 512MB and what somebody pulls off it is as likely to be a build artifact
# as a source file.
tokio-util = { version = "0.7", features = ["io"] }
libc = "0.2"
rcgen = "0.13"
sha2 = "0.10"
# Scoped attach tokens (`scope.rs`). RustCrypto's, sharing the `digest`
# traits sha2 already brings, and its `verify_slice` is the constant-time
# comparison this must not hand-roll.
hmac = "0.12"
base64 = "0.22"
subtle = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util", "fs", "process"] }

# Sinclair's pty and terminal core, unmodified. Path deps for the spike; the
# same problem devpipecore has, and it wants the same answer.
pty = { path = "../../sinclair/crates/pty" }
vt = { path = "../../sinclair/crates/vt" }

[dev-dependencies]
