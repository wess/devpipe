[workspace]

[package]
name = "devpiped"
version = "0.1.0"
edition = "2024"
description = "Persistent terminal sessions over a websocket, for the Devpipe client"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures-util = "0.3"
libc = "0.2"
rcgen = "0.13"
sha2 = "0.10"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

# Sinclair's pty and terminal core, unmodified. Path deps for the spike; the
# same problem devpipecore has, and it wants the same answer.
pty = { path = "../../sinclair/crates/pty" }
vt = { path = "../../sinclair/crates/vt" }

[dev-dependencies]
