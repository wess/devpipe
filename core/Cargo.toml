[workspace]

[package]
name = "devpipecore"
version = "0.1.0"
edition = "2024"
description = "WebAssembly terminal emulator for the Devpipe web client"

# cdylib produces the .wasm the web client loads, and rlib lets the tests use
# the Rust API directly without going through the exported C-compatible layer.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Sinclair's terminal core, unmodified and gpui-free. Pinned to a released tag
# so a clean Devpipe checkout builds without a sibling repository.
vt = { git = "https://github.com/wess/sinclair.git", tag = "v1.33.1" }
