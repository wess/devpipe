[workspace]

[package]
name = "devpipecore"
version = "0.1.0"
edition = "2024"
description = "C ABI over sinclair's VT emulator, for the Devpipe iPad client"

# staticlib links into the iOS app bundle, cdylib produces the .wasm the web
# client loads, and rlib lets the tests use the Rust API directly without
# going through the C layer. All three come from the same source, which is the
# point: the browser and the iPad run the same terminal emulator rather than
# two implementations that drift.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Sinclair's terminal core, unmodified and gpui-free. Pinned to a released tag
# so a clean Devpipe checkout builds without a sibling repository.
vt = { git = "https://github.com/wess/sinclair.git", tag = "v1.33.1" }
