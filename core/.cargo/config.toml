# Linkers for the Android targets.
#
# The NDK ships one clang per (architecture, API level); pointing Rust at it is
# the whole of what `cargo-ndk` does for this crate, and the crate has no C
# dependencies to complicate it. 24 is the minimum API these targets are built
# against — old enough to cover any device that would run this, new enough to
# have a complete libc.
#
# Paths come from `brew install --cask android-ndk`. Override ANDROID_NDK_HOME
# and regenerate if yours lives somewhere else.
[target.aarch64-linux-android]
linker = "/opt/homebrew/share/android-ndk/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android24-clang"

[target.armv7-linux-androideabi]
linker = "/opt/homebrew/share/android-ndk/toolchains/llvm/prebuilt/darwin-x86_64/bin/armv7a-linux-androideabi24-clang"

[target.x86_64-linux-android]
linker = "/opt/homebrew/share/android-ndk/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android24-clang"
